{% extends "base.html" %}

{% block title %}Reset Password — NEXORA<div id="nx-urls" hidden
     data-login="{{ url_for('auth.login') }}"
     data-emlogin="{{ url_for('auth.emlogin') }}"
     data-seeker="{{ url_for('auth.seekerdashboard') }}"
     data-employer="{{ url_for('auth.employerdashboard') }}"></div>
{% endblock %}

{% block content %}
<div class="auth-page">
    <section class="login-section" style="width: 100%; max-width: 600px; margin: 0 auto; display: flex; justify-content: center; align-items: center; padding: 40px 20px;">
        <div class="login-card" style="width: 100%;">
            <div class="form-heading text-center mb-8">
                <h2 class="text-2xl font-bold mb-2 text-navy">Reset Your Password</h2>
                <p class="text-gray-600">Please enter your new password below.</p>
            </div>

            <form id="resetPasswordForm">
                <div class="input-group mb-4">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper relative">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="newPassword" placeholder="Create a secure password" required minlength="6" class="w-full">
                        <button type="button" class="show-password toggle-pwd absolute right-3 top-1/2 -translate-y-1/2" data-target="newPassword">👁</button>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="h-2 w-full bg-gray-200 rounded-full overflow-hidden flex">
                        <div id="strengthMeter" class="h-full bg-rose-500 w-0 transition-all duration-300"></div>
                    </div>
                    <p id="strengthText" class="text-xs text-gray-500 mt-1">Password strength</p>
                </div>

                <div class="input-group mb-8">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper relative">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required class="w-full">
                        <button type="button" class="show-password toggle-pwd absolute right-3 top-1/2 -translate-y-1/2" data-target="confirmPassword">👁</button>
                    </div>
                </div>

                <button type="submit" class="login-button w-full" id="submitBtn">Update Password</button>
            </form>
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
    const newPassword = document.getElementById('newPassword');
    const strengthMeter = document.getElementById('strengthMeter');
    const strengthText = document.getElementById('strengthText');

    document.querySelectorAll('.toggle-pwd').forEach(btn => {
        btn.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const pwdInput = document.getElementById(targetId);
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                this.textContent = '🔒';
            } else {
                pwdInput.type = 'password';
                this.textContent = '👁';
            }
        });
    });

    newPassword.addEventListener('input', function() {
        const val = newPassword.value;
        let strength = 0;
        
        if (val.length >= 8) strength += 25;
        if (val.match(/[A-Z]/)) strength += 25;
        if (val.match(/[0-9]/)) strength += 25;
        if (val.match(/[^A-Za-z0-9]/)) strength += 25;

        strengthMeter.style.width = strength + '%';
        
        if (strength < 50) {
            strengthMeter.style.backgroundColor = 'var(--rose)';
            strengthText.textContent = 'Weak (Use letters, numbers, and symbols)';
        } else if (strength < 100) {
            strengthMeter.style.backgroundColor = 'var(--amber)';
            strengthText.textContent = 'Good';
        } else {
            strengthMeter.style.backgroundColor = 'var(--mint)';
            strengthText.textContent = 'Strong';
        }
    });

    const RESET_URLS = document.getElementById('nx-urls').dataset;

    function backToLogin() {
        let intent = null;
        try { intent = localStorage.getItem('nx_login_intent'); } catch (e) {}
        return intent === 'employer' ? RESET_URLS.emlogin : RESET_URLS.login;
    }

    // The reset page only works with a valid recovery session (created when the
    // person clicks the emailed link). If there is none, say so right away.
    setTimeout(async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            showToast('This reset link is invalid or has expired. Please request a new one.', 'error');
            setTimeout(() => window.location.replace(backToLogin()), 2500);
        }
    }, 1200);

    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const pwd = newPassword.value;
        const confirmPwd = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('submitBtn');

        if (pwd !== confirmPwd) {
            showToast('Passwords do not match!', 'error');
            return;
        }

        if (pwd.length < 6) {
            showToast('Password must be at least 6 characters.', 'error');
            return;
        }

        const { data: { session: activeSession } } = await supabaseClient.auth.getSession();
        if (!activeSession) {
            showToast('This reset link has expired. Please request a new one.', 'error');
            setTimeout(() => window.location.replace(backToLogin()), 2000);
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Updating...';
        btn.style.opacity = '0.7';

        // updating their password on the backend
        const { data, error } = await supabaseClient.auth.updateUser({
            password: pwd,
            data: { password_set: true }
        });

        if (error) {
            console.error('Error setting password:', error);
            showToast(error.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Update Password';
            btn.style.opacity = '1';
            return;
        }
        
        showToast("Password updated successfully!", "success");

        // give it a tiny wait so the user can see the success message
        try { localStorage.removeItem('nx_login_intent'); } catch (err) {}

        setTimeout(() => {
            window.location.href = (data?.user?.user_metadata?.role === 'employer')
                ? RESET_URLS.employer
                : RESET_URLS.seeker;
        }, 1500);
    });
</script>
{% endblock %}
